name: Cloudflare migration test

on:
  push:
    branches:
      - cloudflare-test
  pull_request:
    branches:
      - cloudflare-test

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install Worker dependencies
        run: npm install --ignore-scripts
        working-directory: worker

      - name: Check security-sensitive Worker syntax
        run: |
          node --check worker/src/index.js
          node --check worker/src/auth.js
          node --check worker/src/crypto.js
          node --check worker/src/uploadProgress.js
          node --check worker/src/storage/backend.js
          node --check worker/src/storage/capabilities.js
          node --check worker/src/storage/jobs.js
          node --check worker/src/storage/pool.js
          node --check worker/src/storage/service.js
          node --check worker/src/storage/streams.js
          node --check worker/src/storage/transfer.js
          node --check worker/src/routes/accounts.js
          node --check worker/src/routes/copy.js
          node --check worker/src/routes/files.js
          node --check worker/src/routes/move.js
          node --check worker/src/routes/storage.js
          node --check worker/src/routes/uploads.js
          node --check worker/src/routes/google.js
          node --check worker/src/providers/storage.js
          node --check worker/src/providers/google.js
          node --check worker/src/providers/googleReplace.js
          node --check worker/src/providers/duplicatePolicy.js
          node --check worker/src/utils/filePolicy.js
          node --check worker/src/utils/sagas.js
          node --check backend/scripts/migrate-sqlite-snapshot-to-postgres.js

      - name: Test storage pool and stream normalization
        run: node --test worker/test/storage-pool.test.js worker/test/storage-streams.test.js

      - name: Verify storage reservation contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS storage_reservations" worker/schema.sql
          grep -q "reservation_id" worker/schema.sql
          grep -q "storage_reservations" worker/migrations/2026-08-17-storage-reservations.sql
          grep -q "reserveStorage" worker/src/routes/uploads.js
          grep -q "releaseStorageReservation" worker/src/routes/uploads.js

      - name: Verify unified copy contract
        run: |
          grep -q "POST /api/files/:id/copy" worker/src/routes/copy.js || grep -q "api/files/:id/copy" worker/src/routes/copy.js
          grep -q "copyFile" worker/src/routes/copy.js
          grep -q "copyRoutes" worker/src/index.js

      - name: Verify transfer job contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS transfer_jobs" worker/migrations/2026-08-17-transfer-jobs.sql
          grep -q "transfer_jobs" worker/migrations/2026-08-17-transfer-jobs.sql
          grep -q "createTransferJob" worker/src/storage/jobs.js
          grep -q "updateTransferJob" worker/src/storage/jobs.js

      - name: Prepare legacy adapters
        run: npm run prepare:legacy
        working-directory: worker

      - name: Verify generated legacy provider imports
        run: |
          node --check worker/src/providers/legacy.js
          node --check worker/generated/adapters/DropboxAdapter.js
          node --check worker/generated/adapters/OneDriveAdapter.js
          node --check worker/generated/adapters/YandexAdapter.js
          node --check worker/generated/adapters/PCloudAdapter.js
          node --check worker/generated/adapters/S3Adapter.js
          node --check worker/generated/adapters/MegaAdapter.js

      - name: Build frontend
        run: npm run build

      - name: Validate Wrangler configuration
        run: npx wrangler@4.123.0 deploy --dry-run
        working-directory: worker
