name: Cloudflare migration test

on:
  push:
    branches:
      - cloudflare-test
  pull_request:
    branches:
      - cloudflare-test

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install Worker dependencies
        run: npm install --ignore-scripts
        working-directory: worker

      - name: Check security-sensitive Worker syntax
        run: |
          node --check worker/src/index.js
          node --check worker/src/auth.js
          node --check worker/src/crypto.js
          node --check worker/src/uploadProgress.js
          node --check worker/src/routes/files.js
          node --check worker/src/routes/uploads.js
          node --check worker/src/routes/google.js
          node --check backend/scripts/migrate-sqlite-snapshot-to-postgres.js

      - name: Build frontend
        run: npm run build

      - name: Validate Wrangler configuration
        run: npx wrangler@4.123.0 deploy --dry-run
        working-directory: worker
