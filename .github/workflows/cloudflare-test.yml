name: Cloudflare migration test

on:
  push:
    branches:
      - cloudflare-test
  pull_request:
    branches:
      - cloudflare-test

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install Worker dependencies
        run: npm install --ignore-scripts
        working-directory: worker

      - name: Check security-sensitive Worker syntax
        run: |
          node --check worker/src/index.js
          node --check worker/transferScheduler.js
          node --check worker/src/auth.js
          node --check worker/src/crypto.js
          node --check worker/src/uploadProgress.js
          node --check worker/src/storage/backend.js
          node --check worker/src/storage/capabilities.js
          node --check worker/src/storage/health.js
          node --check worker/src/storage/jobs.js
          node --check worker/src/storage/pool.js
          node --check worker/src/storage/rebalance.js
          node --check worker/src/storage/runner.js
          node --check worker/src/storage/service.js
          node --check worker/src/storage/streams.js
          node --check worker/src/storage/transfer.js
          node --check worker/src/storage/virtualFolders.js
          node --check worker/src/routes/accounts.js
          node --check worker/src/routes/backgroundMove.js
          node --check worker/src/routes/copy.js
          node --check worker/src/routes/files.js
          node --check worker/src/routes/move.js
          node --check worker/src/routes/storage.js
          node --check worker/src/routes/transfers.js
          node --check worker/src/routes/uploads.js
          node --check worker/src/routes/virtualFolders.js
          node --check worker/src/routes/google.js
          node --check worker/src/providers/storage.js
          node --check worker/src/providers/google.js
          node --check worker/src/providers/googleReplace.js
          node --check worker/src/providers/duplicatePolicy.js
          node --check worker/src/utils/filePolicy.js
          node --check worker/src/utils/fileNames.js
          node --check worker/src/utils/storageErrors.js
          node --check worker/src/utils/sagas.js
          node --check backend/scripts/migrate-sqlite-snapshot-to-postgres.js

      - name: Test storage pool and stream normalization
        run: node --test worker/test/storage-pool.test.js worker/test/storage-streams.test.js

      - name: Verify storage reservation contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS storage_reservations" worker/schema.sql
          grep -q "reservation_id" worker/schema.sql
          grep -q "storage_reservations" worker/migrations/2026-08-17-storage-reservations.sql
          grep -q "reserveStorage" worker/src/routes/uploads.js
          grep -q "releaseStorageReservation" worker/src/routes/uploads.js

      - name: Verify transient storage failover contract
        run: |
          grep -q "STORAGE_TRANSIENT" worker/src/utils/storageErrors.js
          grep -Eq "429.*502.*503.*504" worker/src/utils/storageErrors.js
          grep -q "isTransientStorageError" worker/src/routes/uploads.js
          grep -q "excludeBackendIds" worker/src/routes/uploads.js
          grep -q "excludeBackendIds" worker/src/storage/service.js
          grep -q "excludedBackendIds" worker/src/storage/pool.js
          grep -q "error.code = payload.code" frontend/src/services/api.js
          grep -q "retryCount" frontend/src/stores/uploadQueue.js

      - name: Verify storage health contract
        run: |
          grep -q "health_status" worker/schema.sql
          grep -q "health_checked_at" worker/schema.sql
          grep -q "health_failure_count" worker/schema.sql
          grep -q "health_status" worker/migrations/2026-08-17-storage-health.sql
          grep -q "placementBackends" worker/src/storage/pool.js
          grep -q "placementHealthy" worker/src/storage/backend.js
          grep -q "health_status" worker/src/storage/service.js
          grep -q "probeStorageAccount" worker/src/storage/service.js
          grep -q "probeAllStorageAccounts" worker/src/storage/service.js
          grep -q "scheduled" worker/src/index.js
          grep -Fq 'crons = ["*/5 * * * *"]' worker/wrangler.toml

      - name: Verify guarded rebalance contract
        run: |
          grep -q "planRebalance" worker/src/storage/rebalance.js
          grep -q "queueRebalanceCycle" worker/src/storage/rebalance.js
          grep -q "runAutomaticRebalance" worker/src/storage/rebalance.js
          grep -q "ENABLE_AUTOMATIC_REBALANCE" worker/src/storage/rebalance.js
          grep -q "REBALANCE_HIGH_WATERMARK" worker/src/storage/rebalance.js
          grep -q "REBALANCE_LOW_WATERMARK" worker/src/storage/rebalance.js
          grep -q "createTransferJob" worker/src/storage/rebalance.js
          grep -q "rebalance" worker/src/storage/rebalance.js
          grep -q "runAutomaticRebalance" worker/src/index.js

      - name: Verify virtual folder namespace contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS virtual_folders" worker/schema.sql
          grep -q "CREATE TABLE IF NOT EXISTS virtual_folder_materializations" worker/schema.sql
          grep -q "CREATE TABLE IF NOT EXISTS virtual_folders" worker/migrations/2026-08-17-virtual-folders.sql
          grep -q "virtual_folder_materializations" worker/migrations/2026-08-17-virtual-folders.sql
          grep -q "ensureVirtualFolder" worker/src/storage/virtualFolders.js
          grep -q "upsertVirtualFolderMaterialization" worker/src/storage/virtualFolders.js
          grep -q "virtualFolderRoutes" worker/src/index.js
          grep -q "virtualFolderRoutes" worker/src/routes/virtualFolders.js
          grep -q "ensureVirtualFolder" worker/src/routes/uploads.js
          grep -q "getVirtualFolderMaterialization" worker/src/routes/uploads.js
          grep -q "upsertVirtualFolderMaterialization" worker/src/routes/uploads.js
          grep -q "performRename" worker/src/routes/virtualFolders.js
          grep -q "virtualFolderId" worker/src/routes/virtualFolders.js
          grep -q "virtualFolderId" worker/src/utils/sagas.js

      - name: Verify virtual folder move destination contract
        run: |
          grep -q "virtual_folders" worker/src/routes/move.js
          grep -q "virtual_folder_materializations" worker/src/routes/move.js
          grep -q "destinationPath" worker/src/routes/move.js

      - name: Verify unified copy contract
        run: |
          grep -q "POST /api/files/:id/copy" worker/src/routes/copy.js || grep -q "api/files/:id/copy" worker/src/routes/copy.js
          grep -q "copyFile" worker/src/routes/copy.js
          grep -q "copyRoutes" worker/src/index.js
          grep -q "existingRootRemoteId" worker/src/storage/transfer.js
          grep -q "createRoot: !existingRootRemoteId" worker/src/storage/transfer.js

      - name: Verify transfer job contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS transfer_jobs" worker/migrations/2026-08-17-transfer-jobs.sql
          grep -q "transfer_jobs" worker/migrations/2026-08-17-transfer-jobs.sql
          grep -q "createTransferJob" worker/src/storage/jobs.js
          grep -q "claimNextTransferJob" worker/src/storage/jobs.js
          grep -q "hasQueuedTransferJobs" worker/src/storage/jobs.js
          grep -q "runTransferJob" worker/src/storage/runner.js
          grep -q "TransferScheduler" worker/transferScheduler.js
          grep -q "TRANSFER_SCHEDULER" worker/wrangler.toml
          grep -q "export class TransferScheduler" worker/transferScheduler.js
          grep -q "export { TransferScheduler, UploadProgress }" worker/src/index.js
          grep -q "transferRoutes" worker/src/index.js

      - name: Verify background move dispatch contract
        run: |
          grep -q "backgroundMoveRoutes" worker/src/index.js
          grep -q "TRANSFER_JOB_THRESHOLD_BYTES" worker/src/routes/backgroundMove.js || grep -q "50 \* 1024 \* 1024" worker/src/routes/backgroundMove.js
          grep -q "createTransferJob" worker/src/routes/backgroundMove.js
          grep -q "reserveStorage" worker/src/routes/backgroundMove.js
          grep -q "return next()" worker/src/routes/backgroundMove.js

      - name: Verify frontend transfer client contract
        run: |
          grep -q "listTransfers" frontend/src/services/api.js
          grep -q "getTransfer" frontend/src/services/api.js
          grep -q "cancelTransfer" frontend/src/services/api.js
          test -f frontend/src/composables/useTransfers.js

      - name: Prepare legacy adapters
        run: npm run prepare:legacy
        working-directory: worker

      - name: Verify generated legacy provider imports
        run: |
          node --check worker/src/providers/legacy.js
          node --check worker/generated/adapters/DropboxAdapter.js
          node --check worker/generated/adapters/OneDriveAdapter.js
          node --check worker/generated/adapters/YandexAdapter.js
          node --check worker/generated/adapters/PCloudAdapter.js
          node --check worker/generated/adapters/S3Adapter.js
          node --check worker/generated/adapters/MegaAdapter.js

      - name: Build frontend
        run: npm run build

      - name: Validate Wrangler configuration
        run: npx wrangler@4.123.0 deploy --dry-run
        working-directory: worker
