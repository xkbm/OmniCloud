name: Cloudflare deploy

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-test

permissions:
  contents: read

jobs:
  migrate-neon-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm install --prefix backend --ignore-scripts
      - name: Validate Neon migration secret
        run: test -n "$DATABASE_URL" || (echo "Missing NEON_DATABASE_URL" && exit 1)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Migrate SQLite snapshot to PostgreSQL test branch
        run: npm --prefix backend run migrate:cloudflare
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  deploy-worker:
    runs-on: ubuntu-latest
    needs: migrate-neon-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Worker dependencies
        run: npm install --ignore-scripts
        working-directory: worker
      - name: Validate deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$NEON_DATABASE_URL" || (echo "Missing NEON_DATABASE_URL" && exit 1)
          test -n "$OMNICLOUD_ENCRYPTION_KEY" || (echo "Missing OMNICLOUD_ENCRYPTION_KEY" && exit 1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OMNICLOUD_ENCRYPTION_KEY: ${{ secrets.OMNICLOUD_ENCRYPTION_KEY }}
      - name: Deploy Worker and provision runtime secrets
        run: |
          printf '%s' "$NEON_DATABASE_URL" | npx wrangler secret put DATABASE_URL
          printf '%s' "$OMNICLOUD_ENCRYPTION_KEY" | npx wrangler secret put ENCRYPTION_KEY
          printf '%s' "$OMNICLOUD_ENCRYPTION_KEY" | npx wrangler secret put AUTH_SECRET
          npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OMNICLOUD_ENCRYPTION_KEY: ${{ secrets.OMNICLOUD_ENCRYPTION_KEY }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_WS_BASE_URL: /ws/uploads
      - name: Prepare Pages bundle
        run: |
          rm -rf pages/dist pages/functions
          cp -R frontend/dist pages/dist
          cp -R functions pages/functions
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Ensure Pages project exists
        run: |
          npx wrangler pages project create omnicloud --production-branch cloudflare-test || true
        working-directory: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Pages
        run: npx wrangler pages deploy . --project-name omnicloud
        working-directory: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
