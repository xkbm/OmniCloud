name: Cloudflare deploy

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-test

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install repository dependencies
        run: npm install --ignore-scripts
      - name: Install Worker dependencies
        run: npm install --prefix worker --ignore-scripts
      - name: Validate deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$NEON_DATABASE_URL" || (echo "Missing NEON_DATABASE_URL" && exit 1)
          test -n "$OMNICLOUD_ENCRYPTION_KEY" || (echo "Missing OMNICLOUD_ENCRYPTION_KEY" && exit 1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OMNICLOUD_ENCRYPTION_KEY: ${{ secrets.OMNICLOUD_ENCRYPTION_KEY }}
      - name: Prepare legacy adapters
        run: npm run prepare:legacy
        working-directory: worker
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
        working-directory: worker
      - name: Provision Worker runtime secrets
        shell: bash
        run: |
          put_secret() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name"; fi
          }
          put_secret DATABASE_URL "$NEON_DATABASE_URL"
          put_secret ENCRYPTION_KEY "$OMNICLOUD_ENCRYPTION_KEY"
          put_secret AUTH_SECRET "$OMNICLOUD_ENCRYPTION_KEY"
          put_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          put_secret ONEDRIVE_CLIENT_SECRET "$ONEDRIVE_CLIENT_SECRET"
          put_secret DROPBOX_CLIENT_SECRET "$DROPBOX_CLIENT_SECRET"
          put_secret YANDEX_CLIENT_SECRET "$YANDEX_CLIENT_SECRET"
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OMNICLOUD_ENCRYPTION_KEY: ${{ secrets.OMNICLOUD_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_WS_BASE_URL: /ws/uploads
      - name: Prepare Pages bundle
        run: |
          rm -rf pages/dist pages/functions
          cp -R frontend/dist pages/dist
          cp -R functions pages/functions
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Ensure Pages project exists
        run: |
          npx wrangler pages project create omnicloud --production-branch cloudflare-test || true
        working-directory: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Pages
        run: npx wrangler pages deploy . --project-name omnicloud
        working-directory: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test Pages
        run: curl --fail --silent --show-error --location https://omnicloud.pages.dev/ >/dev/null
